[env:t_echo]
extends = nrf52_base
board = nrf52840_dk_adafruit
debug_tool = jlink
upload_protocol = nrfutil

lib_ignore =
    AceButton
    Adafruit TCA8418
	epdiy
    es7210
    ESP32-audioI2S
	GxEPD2
    lvgl
    SensorLibTDECKPro
    TFT_eSPI
    Timeout
    TinyGSM
    XPowersLib

lib_deps = 
	${libs.lib_deps}
	${nrf52libs.lib_deps}

	; Display Library
	https://github.com/ZinggJM/GxEPD

lib_archive = no
; -Os instead of the Adafruit framework's -Ofast, as on wiscore_rak4631 (see
; there). Measured 2026-10-06: link failure (flash 9344 B over) -> 73.0 %. Not hardware-verified on this board; the
; RAK4631 runs the same SoC, SoftDevice and SX1262 path with -Os since 09-29.
build_unflags =
	-Ofast
build_flags =
	-Os
	${nrf52_base.build_flags}
	${common.build_flags}

	-I src/nrf52
	-I variants/${this.__env__}
	
	-D BOARD_T_ECHO="T_ECHO"

	-D SERIAL_BUFFER_SIZE=250
	
	-D DISABLE_NET_CONSOLE