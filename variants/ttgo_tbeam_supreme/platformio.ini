[env:ttgo_tbeam_supreme]
extends = esp32_s3
board = t-beams3-supreme
monitor_filters = esp32_exception_decoder
board_upload.use_1200bps_touch = true

lib_ignore =
	AceButton
	Adafruit TCA8418
	epdiy
	ESP32-audioI2S
	lvgl
	SensorLibTDECKpro
	TFT_eSPI
	TinyGSM

lib_deps = 
	${libs.lib_deps}
	${esp32libs.lib_deps}
	ropg/Heltec_ESP32_LoRa_v3@^0.9.1

	; Display Library
	olikraus/U8g2@^2.36.5
	
build_flags = 
	${esp32.build_flags}
	${common.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D MONITOR_SPEED=${upload_settings.monitor_speed}
	-D BOARD_TBEAM_V3="tbeam_supreme_l76k"
	-I variants/${this.__env__}
