[env:LilyGo_T3_S3_V1_3]
extends = esp32_s3
board = lilygo-t3-s3
monitor_filters = esp32_exception_decoder
board_upload.use_1200bps_touch = true

lib_ignore =
	AceButton
	Adafruit TCA8418
	epdiy
	es7210
	ESP32-audioI2S
	GxEPD2
	lvgl
	SensorLibTDECKpro
	TFT_eSPI
	TinyGSM

lib_deps = 
	${libs.lib_deps}
	${esp32libs.lib_deps}
	ropg/Heltec_ESP32_LoRa_v3@^0.9.1

	; Display Library
	olikraus/U8g2
	
build_flags = 
	${esp32.build_flags}
	${common.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D MONITOR_SPEED=${upload_settings.monitor_speed}
	-D BOARD_T3S3_V13="t3_s3_v1_x"
	-I variants/${this.__env__}
