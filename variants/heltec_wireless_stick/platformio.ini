[env:heltec_wireless_stick]
extends = esp32_s3
board = heltec_wifi_lora_32_V3

lib_ignore = Adafruit TCA8418, epdiy, es7210, ESP32-audioI2S, GxEPD2, lvgl, SensorLib, TFT_eSPI, TinyGSM

lib_deps = 
	${libs.lib_deps}
	${esp32libs.lib_deps}

	; Display Library
	olikraus/U8g2@^2.36.5
	
build_flags = 
	-D U8X8_HAVE_2ND_HW_I2C=1   ; OLED on Wire1 (U8g2 enables it only with WIRE_INTERFACES_COUNT>1, which arduino-esp32 lacks)
	${esp32.build_flags}
	${common.build_flags}
	-D BOARD_STICK_V3="heltec_stick"
	-I variants/${this.__env__}