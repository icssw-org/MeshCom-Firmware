[env:t5_epaper]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
upload_speed =  921600
monitor_speed = 115200
; monitor_port = COM136
monitor_filters = esp32_exception_decoder
;board_build.partition = default_16MB.csv
; extra_scripts =  ./script/pos_extra_script.py

build_flags = 
	; F1: wie in [esp32] -- dieses Env erbt nicht von dort, braucht die
	; Anhebung aber genauso (sendExtern()-Kette, siehe platformio.ini [esp32]).
	-D ARDUINO_LOOP_STACK_SIZE=12288
	-DBOARD_HAS_PSRAM

    -D MONITOR_SPEED=115200

    ; Enable -DARDUINO_USB_CDC_ON_BOOT will start printing and wait for terminal access during startup
    -DARDUINO_USB_CDC_ON_BOOT=1

    -DCORE_DEBUG_LEVEL=1

    -DLOG_PORT=Serial

    -DDISABLE_ALL_LIBRARY_WARNINGS

    -Wl,--gc-sections

	-D BOARD_T5_EPAPER="t5-epaper"

	-I variants/${this.__env__}

	; Der BQ27220-Treiber liegt unter src/t-deck-pro/ und wird von BEIDEN
	; Boards benutzt: src/t5-epaper/t5epaper_main.h:18 zieht "bq27220.h"
	; unbedingt herein, und src/t5-epaper/ui_port.cpp ruft rund 15 seiner
	; Methoden auf. Ohne diesen Suchpfad bricht jede Uebersetzungseinheit
	; dieser Umgebung mit "bq27220.h: No such file or directory" ab.
	-I src/t-deck-pro

lib_ignore = es7210, TFT_eSPI

build_src_filter = 
	+<*>
	+<t5-epaper/*>
	-<nrf52/*>
	-<Displays/*>
	-<Fonts/*>
	-<GFX_Root/*>
	;-<Platforms/*>
	-<SDWrapper/*>
	-<safeboot/*>
	-<t-deck/*>
	-<t-deck-pro/*>
	; ... bis auf den geteilten BQ27220-Treiber, siehe -I oben.
	+<t-deck-pro/bq27220.cpp>
	+<t-deck-pro/bq27220_data_memory.c>

; Diese Umgebung fuehrte die gemeinsame Sensorliste aus [libs] als eigene
; Kopie -- 16 Zeilen, die bei jeder Aenderung an [libs] auseinanderlaufen.
; Genau das ist hier passiert: [libs] enthaelt die SparkFun-u-blox-Bibliothek,
; die Kopie nicht, und src/esp32/esp32_pmu.cpp:13 zieht deren Header
; UNBEDINGT herein -- fuer jedes ESP32-Board. Die Umgebung konnte also nie
; uebersetzen. Jetzt geerbt statt kopiert.
;
; Die boardeigenen Eintraege bleiben ausdruecklich stehen, insbesondere
; RadioLib 7.1.2: [esp32libs] pinnt 7.6.0, und diese Version zu aendern ist
; eine Verhaltensaenderung auf einem Board, das auf keiner Bench steht.
lib_deps =
	${libs.lib_deps}

	Wire
	marian-craciunescu/ESP32Ping @ ^1.7  ; src/udp_functions.cpp:52, unbedingt
	h2zero/NimBLE-Arduino@2.2.3
	jgromes/RadioLib@7.1.2
	lewisxhe/SensorLib @ ^0.2.6
	lewisxhe/XPowersLib
