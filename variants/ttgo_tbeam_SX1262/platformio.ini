[env:ttgo_tbeam_SX1262]
extends = esp32_classic
board = ttgo-t-beam

lib_ignore =
	AceButton
	Adafruit TCA8418
	epdiy
	es7210
	ESP32-audioI2S
	GxEPD2
	lvgl
	SensorLibTDECKpro
	TFT_eSPI
	TinyGSM

lib_deps = 
	${libs.lib_deps}
	${esp32libs.lib_deps}

	; Display Library
	olikraus/U8g2@^2.36.5
	
; R3-02 / MEM-04: the board definition ttgo-t-beam.json carries
; -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue, which only these three envs
; inherit. With the flag, initArduino() calls psramInit(), which links
; esp_spiram_init and spiram_psram.c -- 4 427 B that must live in IRAM because
; it runs with the cache disabled. This env had 20 BYTES of iram0_0_seg free.
;
; Measured on T-Beam-92 (V1.2, AXP2101) before removing it: PSRAM is present
; and working, 4 191 863 B free at init, and the firmware uses 596 of them.
; There is no ps_malloc call site in any classic-T-Beam source file -- every
; one in the tree is under src/t-deck/ or src/t5-epaper/, which are S3 boards
; not built by these envs. So the 4 MB is real and idle.
;
; It is traded deliberately for the IRAM, because PSRAM cannot substitute:
; IRAM holds code that runs with the cache off, PSRAM is data memory behind
; that same cache. Nothing put in PSRAM frees a byte of IRAM. Moving the
; static rings there is closed off anyway --
; CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY is not set in the prebuilt SDK,
; so EXT_RAM_ATTR does nothing without rebuilding ESP-IDF.
;
; Reversible: delete this block to get PSRAM back and pay the IRAM again. A
; feature that wants it must guard with psramFound() regardless -- the fleet
; is mixed (dj8meh-41, same V1.2/AXP2101 class, reports [PSRM] 0).
build_unflags =
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue

build_flags = 
	${esp32.build_flags}
	${common.build_flags}
	-D BOARD_SX1262="tbeam_SX1262"
	-I variants/${this.__env__}