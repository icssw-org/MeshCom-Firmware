[env:E22_XML-DevKitC]
extends = esp32_classic
board = az-delivery-devkit-v4
monitor_dtr = 0
monitor_rts = 0

lib_ignore =
	AceButton
	Adafruit TCA8418
	epdiy
	ESP32-audioI2S
	lvgl
	SensorLibTDECKpro
	TFT_eSPI
	TinyGSM
	XPowersLib
	
lib_deps =
	${libs.lib_deps}
	${esp32libs.lib_deps}
	plerup/EspSoftwareSerial@^8.2.0

	; Display Library
	olikraus/U8g2@^2.36.5
	
build_flags = 
	${esp32.build_flags}
	${common.build_flags}
	-D BOARD_E22="az-delivery-devkit-v4"
	-I variants/${this.__env__}
	-D DISABLE_NET_CONSOLE
	-D MC_DIAG=0
	; KISS/TCP stays ON here, unlike upstream: upstream opts this board out
	; (-D DISABLE_KISS_TCP) because its dram0_0_seg overflows by 32 B with KISS
	; compiled in (1160 B headroom there). After the RAM reclaim this board has
	; ~29 kB of DRAM headroom (measured 2026-09-25 before the upstream merge),
	; so KISS fits. Re-add the opt-out if dram0_0_seg or iram0_0_seg headroom
	; ever drops below 4000 B (tools/neo/gate.sh floor).
	-D MC_INJECT_HOOKS=0