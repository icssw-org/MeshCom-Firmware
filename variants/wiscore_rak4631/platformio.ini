[env:wiscore_rak4631]
extends = nrf52_base
board = rak4630

lib_ignore =
    AceButton
    Adafruit TCA8418
    es7210
    ESP32-audioI2S
    lvgl
    SensorLibTDECKPro
    TFT_eSPI
    epdiy
    Timeout
    TinyGSM
    XPowersLib

lib_deps = 
	${libs.lib_deps}
	${nrf52libs.lib_deps}

	; Display Library
	olikraus/U8g2@^2.36.5
	
lib_archive = no
; -Os instead of the Adafruit framework's -Ofast (nordicnrf52 adafruit.py adds
; -Ofast to CCFLAGS and LINKFLAGS; nothing overrode it). Measured 2026-09-28:
; flash 96.1 % -> 70.4 %, RAM unchanged. Also ends -ffast-math on the RAK, so
; isnan()/v!=v checks are no longer folded away. Bench-verified on DK5EN-90
; before release (radio, BLE, Ethernet timing).
build_unflags =
	-Ofast
build_flags =
	${nrf52_base.build_flags}
	-I variants/${this.__env__}
	-D DISABLE_NET_CONSOLE
	-Os