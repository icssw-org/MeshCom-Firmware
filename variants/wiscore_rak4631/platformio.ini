[env:wiscore_rak4631]
extends = nrf52_base
board = rak4630

lib_ignore =
    AceButton
    Adafruit TCA8418
    es7210
    ESP32-audioI2S
    lvgl
    SensorLibTDECKPro
    TFT_eSPI
    epdiy
    Timeout
    TinyGSM
    XPowersLib

lib_deps = 
	${libs.lib_deps}
	${nrf52libs.lib_deps}

	; Display Library
	olikraus/U8g2@^2.36.5
	
lib_archive = no
build_flags =
	${nrf52_base.build_flags}
	-I variants/${this.__env__}
	-D DISABLE_NET_CONSOLE