[env:heltec_wifi_lora_32_V3]
extends = esp32_s3
board = heltec_wifi_lora_32_V3

lib_ignore =
	AceButton
	Adafruit TCA8418
	epdiy
	ESP32-audioI2S
	lvgl
	SensorLibTDECKpro
	TFT_eSPI
	TinyGSM
	XPowersLib

lib_deps = 
	${libs.lib_deps}
	${esp32libs.lib_deps}

	; Display Library
	olikraus/U8g2@^2.36.5
	
build_flags = 
	-D U8X8_HAVE_2ND_HW_I2C=1   ; OLED on Wire1 (U8g2 enables it only with WIRE_INTERFACES_COUNT>1, which arduino-esp32 lacks)
	${esp32.build_flags}
	${common.build_flags}
	-DARDUINO_USB_MODE=1
	;-DARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HELTEC_V3="heltec_v3"
	-I variants/${this.__env__}